name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The version the app is built and released with (tool/build_release.sh
      # on the developer's machine); newer releases deprecate APIs it uses.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - uses: gradle/actions/setup-gradle@v4

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test

      # gradlew and local.properties are not in git; this writes them without
      # building. android/key.properties is not needed: without it the release
      # build type falls back to debug signing.
      - name: Generate Android Gradle config
        run: flutter build apk --config-only --debug

      # :app only, so the plugins' own unit tests are not run.
      - name: Kotlin unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Upload Kotlin test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-test-reports
          path: build/app/reports/tests/
          if-no-files-found: ignore

  # Keeps the iOS app compiling. No signing: there is no Apple developer
  # account; see release-ios.yml for the unsigned build attached to releases.
  ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: Build iOS app (unsigned)
        run: flutter build ios --release --no-codesign
