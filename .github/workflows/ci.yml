name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The version the app is built and released with (tool/build_release.sh
      # on the developer's machine); newer releases deprecate APIs it uses.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - uses: gradle/actions/setup-gradle@v4

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test

      # gradlew and local.properties are not in git; this writes them without
      # building. android/key.properties is not needed: without it the release
      # build type falls back to debug signing.
      - name: Generate Android Gradle config
        run: flutter build apk --config-only --debug

      # :app only, so the plugins' own unit tests are not run.
      - name: Kotlin unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Upload Kotlin test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-test-reports
          path: build/app/reports/tests/
          if-no-files-found: ignore

  # Keeps the iOS app compiling. No signing: there is no Apple developer
  # account; see release-ios.yml for the unsigned build attached to releases.
  ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: flutter pub get
        run: flutter pub get

      # The widget's Swift port of the sun maths, against the same vectors
      # as the Dart and Kotlin versions.
      - name: Swift sun maths vs. shared vectors
        run: |
          swiftc -O ios/SunClockWidget/SunCalc.swift tool/ios/vectors/main.swift -o "$RUNNER_TEMP/vectors"
          "$RUNNER_TEMP/vectors" test/solar_vectors.json

      # Pictures of the widget views (no iPhone home screen to look at).
      - name: Render widget views
        run: |
          swiftc -parse-as-library ios/SunClockWidget/SunCalc.swift             ios/SunClockWidget/SharedStore.swift ios/SunClockWidget/WidgetViews.swift             tool/ios/render_widget.swift -o "$RUNNER_TEMP/render"
          "$RUNNER_TEMP/render" widget-renders

      - name: Upload widget renders
        uses: actions/upload-artifact@v4
        with:
          name: ios-widget-renders
          path: widget-renders/

      - name: Add the widget extension to the Xcode project
        run: ruby tool/ios/add_widget_target.rb

      - name: Build iOS app (unsigned)
        run: flutter build ios --release --no-codesign

      - name: The widget is inside the app
        run: |
          ls build/ios/iphoneos/Runner.app/PlugIns/SunClockWidget.appex
          plutil -p build/ios/iphoneos/Runner.app/PlugIns/SunClockWidget.appex/Info.plist | grep -E "NSExtensionPointIdentifier|CFBundleShortVersionString"

      # No iPhone to try it on: start the app in the simulator and take a
      # picture once it has drawn its first frames.
      - name: Run in the simulator
        run: |
          flutter build ios --simulator --debug
          ls build/ios/iphonesimulator/Runner.app/PlugIns/SunClockWidget.appex
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in sorted(d, reverse=True) if 'iOS' in k for x in d[k] if x['name'].startswith('iPhone')))")
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE"
          xcrun simctl install "$DEVICE" build/ios/iphonesimulator/Runner.app
          xcrun simctl privacy "$DEVICE" grant location com.sunriseclock.sunClock || true
          xcrun simctl location "$DEVICE" set 52.52,13.405 || true
          xcrun simctl launch "$DEVICE" com.sunriseclock.sunClock
          sleep 40
          mkdir -p simulator
          xcrun simctl io "$DEVICE" screenshot simulator/app.png
          xcrun simctl spawn "$DEVICE" launchctl list | grep -i sunclock

      - name: Upload simulator screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator
          path: simulator/
