name: iOS release build

# Builds the iOS app for a GitHub release and attaches it as an unsigned
# .ipa. It is not signed (no Apple developer account), so it cannot go to
# the App Store or TestFlight; it can be sideloaded with a tool that signs
# it with the installer's own Apple ID (for example AltStore or Sideloadly).
#
# Runs when a release is published, or by hand for an existing release:
#   gh workflow run release-ios.yml -f tag=v1.3.0

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v1.3.0
        required: true

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: Build iOS app (unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package the unsigned .ipa
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry "SunClock-${TAG#v}-ios-unsigned.ipa" Payload

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "SunClock-${TAG#v}-ios-unsigned.ipa" --clobber
